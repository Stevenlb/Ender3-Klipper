[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 115200
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 4000
max_z_velocity: 10
max_z_accel: 100

# --- STEPPERS ---

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -3
homing_retract_dist: 5.0

# --- EXTRUDER & BED ---

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 33.683 
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
pid_kp: 21.527
pid_ki: 1.063
pid_kd: 108.982
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 54.027
pid_ki: 0.770
pid_kd: 948.182
min_temp: 0
max_temp: 130

# --- BIQU MICROPROBE V2 (DIGITAL MODE) ---

[output_pin probe_enable]
pin: PB0             # Yellow Wire
value: 0

[probe]
pin: ^!PB1           # White Wire (V2 is low-level triggered)
x_offset: -44.0
y_offset: -7.0
z_offset: 0          # Reset to 0 for calibration
speed: 5.0
samples: 2
sample_retract_dist: 2.0
deactivate_on_each_sample: False
activate_gcode:
    SET_PIN PIN=probe_enable VALUE=1
    G4 P500
deactivate_gcode:
    SET_PIN PIN=probe_enable VALUE=0
    G4 P500

[gcode_macro PROBE_DEPLOY]
gcode:
    SET_PIN PIN=probe_enable VALUE=1

[gcode_macro PROBE_STOW]
gcode:
    SET_PIN PIN=probe_enable VALUE=0

# --- HOMING & UI ---

[safe_z_home]
home_xy_position: 117.5, 117.5
z_hop: 10

[display]
lcd_type: st7920
cs_pin: PB12
sclk_pin: PB13
sid_pin: PB15
encoder_pins: ^PB14, ^PB10
click_pin: ^!PB2

[fan]
pin: PA0

[virtual_sdcard]
path: ~/printer_data/gcodes
[pause_resume]
[display_status]
