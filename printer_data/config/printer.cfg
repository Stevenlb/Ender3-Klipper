[save_variables]
filename: ~/printer_data/config/variables.cfg

# --- MCU & SYSTEM ---
[include mainsail.cfg]
[respond]

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 115200
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
square_corner_velocity: 5.0
max_z_velocity: 10
max_z_accel: 100

# --- INPUT SHAPER ---
[input_shaper]
shaper_freq_x: 85.7
shaper_type_x: mzv
shaper_freq_y: 40.0
shaper_type_y: mzv

# --- STEPPERS ---

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -3
homing_retract_dist: 5.0

# --- EXTRUDER & BED ---

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 33.683 
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
pressure_advance: 0.784
pressure_advance_smooth_time: 0.040
min_extrude_temp: 140   
control: pid
pid_kp: 21.527
pid_ki: 1.063
pid_kd: 108.982
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 54.027
pid_ki: 0.770
pid_kd: 948.182
min_temp: 0
max_temp: 130

# --- BIQU MICROPROBE V2 ---

[output_pin probe_enable]
pin: PB0
value: 0

[probe]
pin: ^!PB1
x_offset: -48.5
y_offset: 0.0
z_offset: 0.475      
speed: 5.0
samples: 3
sample_retract_dist: 3.0
samples_result: median
samples_tolerance: 0.1
samples_tolerance_retries: 5
deactivate_on_each_sample: False
activate_gcode:
    SET_PIN PIN=probe_enable VALUE=1
    G4 P500
deactivate_gcode:
    SET_PIN PIN=probe_enable VALUE=0
    G4 P500

# --- START MACRO (Forced Mesh Every Print) ---

[gcode_macro START_PRINT]
gcode:
    # 1. Fetch Temperatures from Slicer
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    
    # 2. Start Heating & Home
    M140 S{BED_TEMP}
    M104 S150
    G90
    
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # 3. Clean Nozzle & Wait for Bed
    M190 S{BED_TEMP}
    M109 S150
    G1 X0 Y0 Z0.3 F5000
    G1 E10 F200
    G1 X50 F12000
    G1 X0 F12000
    G1 Z5 F3000

    # 4. Forced Bed Mesh
    RESPOND MSG="Generating fresh bed mesh..."
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE
    
    # 5. Final Heat & Prime Line
    G1 X0.1 Y20 Z5 F5000.0
    M109 S{EXTRUDER_TEMP}
    
    G1 Z0.3 F3000
    G1 X0.1 Y200.0 Z0.3 F1500.0 E15
    G1 X0.4 Y200.0 Z0.3 F5000.0
    G1 X0.4 Y20 Z0.3 F1500.0 E30
    G92 E0
    G1 Z2.0 F3000

[gcode_macro END_PRINT]
gcode:
    M140 S0
    M104 S0
    G91
    G1 Z10 F3000
    G90
    G1 X0 Y235 F6000
    M84 X Y E
    RESPOND MSG="Print Finished."

# --- SAFETY LIMITS & MESH ---

[safe_z_home]
home_xy_position: 117.5, 117.5
z_hop: 10

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 30, 30
mesh_max: 186, 190    
probe_count: 5, 5
algorithm: bicubic

[screws_tilt_adjust]
screw1: 74, 37
screw1_name: front_left_screw
screw2: 186, 37
screw2_name: front_right_screw
screw3: 186, 207
screw3_name: rear_right_screw
screw4: 74, 207
screw4_name: rear_left_screw
horizontal_move_z: 10
speed: 150
screw_thread: CW-M4

# --- MISC & UI ---

[display]
lcd_type: st7920
cs_pin: PB12
sclk_pin: PB13
sid_pin: PB15
encoder_pins: ^PB14, ^PB10
click_pin: ^!PB2

[fan]
pin: PA0

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]
[display_status]
[exclude_object]
[idle_timeout]
timeout: 43200 

#*# <---------------------- SAVE_CONFIG ---------------------->
