[save_variables]
filename: ~/printer_data/config/variables.cfg

# --- MCU & SYSTEM ---
[include mainsail.cfg]
[respond]

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 115200
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
square_corner_velocity: 5.0
max_z_velocity: 10
max_z_accel: 100

# --- INPUT SHAPER (Ringing Fix) ---
[input_shaper]
shaper_freq_x: 85.7
shaper_type_x: mzv
shaper_freq_y: 40.0
shaper_type_y: mzv

# --- STEPPERS ---

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -3
homing_retract_dist: 5.0

# --- EXTRUDER & BED ---

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 33.683 
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
pressure_advance: 0.784
pressure_advance_smooth_time: 0.040
min_extrude_temp: 140   
control: pid
pid_kp: 21.527
pid_ki: 1.063
pid_kd: 108.982
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 54.027
pid_ki: 0.770
pid_kd: 948.182
min_temp: 0
max_temp: 130

# --- BIQU MICROPROBE V2 ---

[output_pin probe_enable]
pin: PB0
value: 0

[probe]
pin: ^!PB1
x_offset: -48.5
y_offset: 0.0
z_offset: 0.475      
speed: 5.0
samples: 3
sample_retract_dist: 3.0
samples_result: median
samples_tolerance: 0.1
samples_tolerance_retries: 5
deactivate_on_each_sample: False
activate_gcode:
    SET_PIN PIN=probe_enable VALUE=1
    G4 P500
deactivate_gcode:
    SET_PIN PIN=probe_enable VALUE=0
    G4 P500

# --- UPDATED START MACRO (Forced Mesh) ---

[gcode_macro START_PRINT]
gcode:
    # 1. Fetch Temperatures from Slicer
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    
    # 2. Start Heating & Home
    [span_6](start_span)M140 S{BED_TEMP}             # Start heating bed[span_6](end_span)
    [span_7](start_span)M104 S150                    # Set nozzle to no-ooze temp[span_7](end_span)
    [span_8](start_span)G90                          # Absolute positioning[span_8](end_span)
    
    {% if "xyz" not in printer.toolhead.homed_axes %}
        [span_9](start_span)G28                      # Home if not already homed[span_9](end_span)
    {% endif %}

    # 3. Clean Nozzle & Wait for Bed
    [span_10](start_span)M190 S{BED_TEMP}             # Wait for bed to reach printing temp[span_10](end_span)
    [span_11](start_span)M109 S150                    # Wait for nozzle to reach no-ooze temp[span_11](end_span)
    [span_12](start_span)G1 X0 Y0 Z0.3 F5000          # Move to corner[span_12](end_span)
    [span_13](start_span)G1 E10 F200                  # Initial cleaning purge[span_13](end_span)
    [span_14](start_span)G1 X50 F12000                # Quick swipe[span_14](end_span)
    [span_15](start_span)G1 X0 F12000                 # Return[span_15](end_span)
    [span_16](start_span)G1 Z5 F3000                  # Clear bed[span_16](end_span)

    # 4. Forced Bed Mesh (Every Print)
    RESPOND MSG="Generating fresh bed mesh..."
    [span_17](start_span)BED_MESH_CLEAR               # Clear old mesh[span_17](end_span)
    [span_18](start_span)[span_19](start_span)BED_MESH_CALIBRATE           # Probing active[span_18](end_span)[span_19](end_span)
    # Note: No SAVE_CONFIG here to avoid mandatory restarts.
    
    # 5. Final Heat & Prime Line
    G1 X0.1 Y20 Z5 F5000.0       # Move to start of prime line
    M109 S{EXTRUDER_TEMP}        # Wait for actual printing temp
    
    G1 Z0.3 F3000
    G1 X0.1 Y200.0 Z0.3 F1500.0 E15
    G1 X0.4 Y200.0 Z0.3 F5000.0
    G1 X0.4 Y20 Z0.3 F1500.0 E30
    G92 E0                       # Reset Extruder
    G1 Z2.0 F3000

[gcode_macro END_PRINT]
gcode:
    [span_20](start_span)M140 S0                      # Turn off bed[span_20](end_span)
    [span_21](start_span)M104 S0                      # Turn off extruder[span_21](end_span)
    [span_22](start_span)G91                          # Relative positioning[span_22](end_span)
    [span_23](start_span)G1 Z10 F3000                 # Raise nozzle[span_23](end_span)
    [span_24](start_span)G90                          # Absolute positioning[span_24](end_span)
    [span_25](start_span)G1 X0 Y235 F6000             # Park at rear[span_25](end_span)
    [span_26](start_span)M84 X Y E                    # Disable motors[span_26](end_span)
    [span_27](start_span)RESPOND MSG="Print Finished. Z-Axis Locked."[span_27](end_span)

# --- SAFETY LIMITS ---

[safe_z_home]
home_xy_position: 117.5, 117.5
z_hop: 10

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 30, 30
mesh_max: 186, 190    
probe_count: 5, 5
algorithm: bicubic

[screws_tilt_adjust]
screw1: 74, 37          
screw1_name: front_left_screw
screw2: 186, 37         
screw2_name: front_right_screw
screw3: 186, 207        
screw3_name: rear_right_screw
screw4: 74, 207         
screw4_name: rear_left_screw
horizontal_move_z: 10
speed: 150
screw_thread: CW-M4

# --- MISC & UI ---

[display]
lcd_type: st7920
cs_pin: PB12
sclk_pin: PB13
sid_pin: PB15
encoder_pins: ^PB14, ^PB10
click_pin: ^!PB2

[fan]
pin: PA0

[virtual_sdcard]
path: ~/printer_data/gcodes
[pause_resume]
[display_status]
[exclude_object]
[idle_timeout]
timeout: 43200 

[gcode_macro UI_PROBE_CALIBRATE]
gcode:
    [span_28](start_span){% if "xyz" not in printer.toolhead.homed_axes %}[span_28](end_span)
        G28
    {% endif %}
    PROBE_CALIBRATE

[gcode_macro UI_BED_TRAMMING]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SCREWS_TILT_CALCULATE

[gcode_macro UI_MESH_SAVE_RESTART]
description: Heat bed to 60C, run mesh, save and restart.
gcode:
    [span_29](start_span)RESPOND MSG="Heating bed to 60C for calibration..."[span_29](end_span)
    [span_30](start_span)M190 S60                     # Wait for bed temp[span_30](end_span)
    
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    [span_31](start_span)M104 S150                    # Nozzle cleaning temp[span_31](end_span)
    M109 S150
    [span_32](start_span)G1 X0 Y0 Z0.3 F5000          # Clean nozzle move[span_32](end_span)
    G1 E5 F200                   
    G1 X50 F12000                
    G1 Z5 F3000

    [span_33](start_span)BED_MESH_CLEAR[span_33](end_span)
    [span_34](start_span)BED_MESH_CALIBRATE[span_34](end_span)
    [span_35](start_span)BED_MESH_PROFILE SAVE=default[span_35](end_span)
    [span_36](start_span)SAVE_CONFIG[span_36](end_span)

[gcode_macro START_PA_CALIBRATION]
description: Special self-printing Pressure Advance Tuning Tower
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(205)|float %}
    {% set PA_START = 0.0 %}
    {% set PA_FACTOR = 0.02 %}

    START_PRINT BED_TEMP={BED_TEMP} EXTRUDER_TEMP={EXTRUDER_TEMP}

    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1 ACCEL=500
    [span_37](start_span)TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START={PA_START} FACTOR={PA_FACTOR}[span_37](end_span)

    G90                         
    G1 Z0.2 F300                
    G1 X90 Y90 F6000            
    [span_38](start_span)M83[span_38](end_span)

    {% for i in range(250) %}
        {% set z_height = (i + 1) * 0.2 %}
        G1 X140 E1.7 F6000      
        G1 Y140 E1.7
        G1 X90  E1.7
        [span_39](start_span)G1 Y90  E1.7[span_39](end_span)
        G1 Z{z_height} F3000    
    {% endfor %}

    END_PRINT
    
#*# <---------------------- SAVE_CONFIG ---------------------->
