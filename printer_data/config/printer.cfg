[save_variables]
filename: ~/printer_data/config/variables.cfg

# --- MCU & SYSTEM ---
[include mainsail.cfg]
[respond]

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 115200
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 4000
max_z_velocity: 10
max_z_accel: 100

# --- STEPPERS ---

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -3
homing_retract_dist: 5.0

# --- EXTRUDER & BED ---

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 33.683 
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
pressure_advance: 0.52
min_extrude_temp: 140   # Allows the 150C cleaning purge to work
control: pid
pid_kp: 21.527
pid_ki: 1.063
pid_kd: 108.982
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 54.027
pid_ki: 0.770
pid_kd: 948.182
min_temp: 0
max_temp: 130

# --- BIQU MICROPROBE V2 ---

[output_pin probe_enable]
pin: PB0
value: 0

[probe]
pin: ^!PB1
x_offset: -48.5
y_offset: 0.0
z_offset: 0.475      # Adjust this via PROBE_CALIBRATE
speed: 5.0
samples: 3
sample_retract_dist: 3.0
samples_result: median
samples_tolerance: 0.1
samples_tolerance_retries: 5
deactivate_on_each_sample: False
activate_gcode:
    SET_PIN PIN=probe_enable VALUE=1
    G4 P500
deactivate_gcode:
    SET_PIN PIN=probe_enable VALUE=0
    G4 P500

# --- THE "NO-THINKING" START MACRO ---

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set CURRENT_DAY = params.DAY|default(0)|int %}
    {% set svv = printer.save_variables.variables %}
    {% set last_mesh_day = svv.last_mesh_day|default(0)|int %}
    
    M140 S{BED_TEMP}             ; Start heating bed
    G90                          ; Absolute positioning
    
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                      ; Home if needed
    {% endif %}

    # 1. CLEAN NOZZLE (Every Print)
    M104 S150                    ; Heat to soften plastic
    M190 S{BED_TEMP}             ; Wait for bed
    M109 S150                    ; Wait for nozzle soften
    G1 X0 Y0 Z0.3 F5000          ; Move to front corner
    G1 E10 F200                  ; Purge a bit of plastic
    G1 X50 F12000                ; Wipe right
    G1 X0 F12000                 ; Wipe left
    G1 Z5 F3000                  ; Clear the area

    # 2. SMART MESH (Once per day)
    {% if CURRENT_DAY != last_mesh_day %}
        RESPOND MSG="New day detected. Probing..."
        BED_MESH_CALIBRATE
        BED_MESH_PROFILE SAVE=default
        SAVE_VARIABLE VARIABLE=last_mesh_day VALUE={CURRENT_DAY}
    {% else %}
        RESPOND MSG="Mesh is fresh. Loading saved profile..."
        BED_MESH_PROFILE LOAD=default
    {% endif %}
    
    # 3. FINAL HEAT & PRIME LINE
    G1 X0.1 Y20 Z5 F5000.0
    M109 S{EXTRUDER_TEMP}        ; Heat to full printing temp
    
    G1 Z0.3 F3000
    G1 X0.1 Y200.0 Z0.3 F1500.0 E15
    G1 X0.4 Y200.0 Z0.3 F5000.0
    G1 X0.4 Y20 Z0.3 F1500.0 E30
    G92 E0
    G1 Z2.0 F3000

[gcode_macro END_PRINT]
gcode:
    M140 S0
    M104 S0
    G91
    G1 Z10 F3000
    G90
    G1 X0 Y235 F6000
    M84 X Y E                   ; Keep Z locked
    RESPOND MSG="Print Finished. Z-Axis Locked."

# --- SAFETY LIMITS (Validated for X -48.5) ---

[safe_z_home]
home_xy_position: 117.5, 117.5
z_hop: 10

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 30, 30
mesh_max: 186, 190    # Nozzle X stays under 235 limit
probe_count: 5, 5
algorithm: bicubic

[screws_tilt_adjust]
screw1: 74, 37          
screw1_name: front_left_screw
screw2: 186, 37         # Nozzle X stays under 235 limit
screw2_name: front_right_screw
screw3: 186, 207        
screw3_name: rear_right_screw
screw4: 74, 207         
screw4_name: rear_left_screw
horizontal_move_z: 10
speed: 150
screw_thread: CW-M4

# --- MISC & UI ---

[display]
lcd_type: st7920
cs_pin: PB12
sclk_pin: PB13
sid_pin: PB15
encoder_pins: ^PB14, ^PB10
click_pin: ^!PB2

[fan]
pin: PA0

[virtual_sdcard]
path: ~/printer_data/gcodes
[pause_resume]
[display_status]
[exclude_object]
[idle_timeout]
timeout: 43200 

[gcode_macro UI_PROBE_CALIBRATE]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    PROBE_CALIBRATE

[gcode_macro UI_BED_TRAMMING]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SCREWS_TILT_CALCULATE

[gcode_macro UI_MESH_SAVE_RESTART]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    M104 S150
    M109 S150
    G1 X0 Y0 Z0.3 F5000
    G1 E5 F200
    G1 X50 F12000
    G1 Z5 F3000
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE=default
    SAVE_CONFIG

