# Testing github backup1004

# --- MCU & SYSTEM ---
[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 115200
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 4000
max_z_velocity: 10
max_z_accel: 100

# --- STEPPERS ---

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -3
homing_retract_dist: 5.0

# --- EXTRUDER & BED ---

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 33.683 
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
pid_kp: 21.527
pid_ki: 1.063
pid_kd: 108.982
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 54.027
pid_ki: 0.770
pid_kd: 948.182
min_temp: 0
max_temp: 130

# --- BIQU MICROPROBE V2 (DIGITAL MODE) ---

[output_pin probe_enable]
pin: PB0
value: 0

[probe]
pin: ^!PB1
x_offset: -44.0
y_offset: -7.0
# ADJUSTED: Lowering this number moves the nozzle AWAY from the bed. 0.155 was too far. Trying .2 now
# z_offset: 0.155 - too far
# z_offset: 0.2 - still too far 
# z_offset: 0.3 - still too far
# z_offset: 0.5 - slight elephant foot
# z_offset: 0.45 -
z_offset: 0.45
speed: 5.0
samples: 2
sample_retract_dist: 2.0
deactivate_on_each_sample: False
activate_gcode:
    SET_PIN PIN=probe_enable VALUE=1
    G4 P500
deactivate_gcode:
    SET_PIN PIN=probe_enable VALUE=0
    G4 P500

# --- AUTOMATIC START/END MACROS ---

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    
    M140 S{BED_TEMP}             ; Start bed heating
    G90                          ; Absolute positioning
    G28                          ; Home all axes
    M190 S{BED_TEMP}             ; Wait for bed to reach temp
    
    BED_MESH_CALIBRATE           ; Automatic Remesh
    
    G1 X0.1 Y20 Z5 F5000.0       ; Move to start position
    M109 S{EXTRUDER_TEMP}        ; Wait for nozzle to reach temp
    
    ; Purge Line
    G1 Z0.3 F3000
    G1 X0.1 Y200.0 Z0.3 F1500.0 E15
    G1 X0.4 Y200.0 Z0.3 F5000.0
    G1 X0.4 Y20 Z0.3 F1500.0 E30
    G92 E0                       ; Reset extruder
    G1 Z2.0 F3000

[gcode_macro END_PRINT]
gcode:
    M140 S0                      ; Turn off bed
    M104 S0                      ; Turn off nozzle
    G91                          ; Relative positioning
    G1 Z10 F3000                 ; Lift nozzle
    G90                          ; Absolute positioning
    G1 X0 Y235 F6000             ; Present print
    M84                          ; Disable motors

# --- UI & MISC ---

[safe_z_home]
home_xy_position: 117.5, 117.5
z_hop: 10

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 30, 30
mesh_max: 190, 190
probe_count: 5, 5
algorithm: bicubic

[display]
lcd_type: st7920
cs_pin: PB12
sclk_pin: PB13
sid_pin: PB15
encoder_pins: ^PB14, ^PB10
click_pin: ^!PB2

[fan]
pin: PA0

[virtual_sdcard]
path: ~/printer_data/gcodes
[pause_resume]
[display_status]

[idle_timeout]
timeout: 43200 # 12 hours in seconds

[exclude_object]

[verify_heater extruder]
max_error: 120
check_gain_time: 30 # Gives it 30 seconds to show a rise before erroring
hysteresis: 5
heating_gain: 2
